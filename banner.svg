<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="160" viewBox="0 0 800 160">
  <style>
    /* 5 SECOND TIMER GLITCH */
    @keyframes glitchShake {
      0%, 85% { transform: translate(0); }
      88% { transform: translate(-6px, 3px); }
      90% { transform: translate(6px, -3px); }
      92% { transform: translate(-3px, -3px); }
      94% { transform: translate(3px, 3px); }
      96% { transform: translate(-6px, 0); }
      100% { transform: translate(0); }
    }
    .glitch-white { animation: glitchShake 5s infinite; fill: #ffffff; }
    .glitch-grey { animation: glitchShake 5s infinite reverse; fill: #555555; }
    .text { font-family: 'Courier New', monospace; font-size: 15px; font-weight: bold; }
  </style>
  
  <!-- PITCH BLACK BACKGROUND -->
  <rect width="100%" height="100%" fill="#000000" />
  
  <!-- LAYER 1: THE GREY SHADOW -->
  <text x="50%" y="50%" text-anchor="middle" class="text glitch-grey">
    <tspan x="50%" dy="-50">███████╗ ██████╗  ██████╗ ██╗  ██╗██████╗  ██████╗ ███████╗███████╗</tspan>
    <tspan x="50%" dy="20">██╔════╝██╔════╝ ██╔═══██╗██║ ██╔╝██╔══██╗██╔═══██╗██╔════╝██╔════╝</tspan>
    <tspan x="50%" dy="20">█████╗  ██║  ███╗██║   ██║█████╔╝ ██████╔╝██║   ██║███████╗███████╗</tspan>
    <tspan x="50%" dy="20">██╔══╝  ██║   ██║██║   ██║██╔═██╗ ██╔══██╗██║   ██║╚════██║╚════██║</tspan>
    <tspan x="50%" dy="20">███████╗╚██████╔╝╚██████╔╝██║  ██╗██║  ██║╚██████╔╝███████║███████║</tspan>
    <tspan x="50%" dy="20">╚══════╝ ╚═════╝  ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚══════╝</tspan>
  </text>

  <!-- LAYER 2: THE PURE WHITE TEXT -->
  <text x="50%" y="50%" text-anchor="middle" class="text glitch-white">
    <tspan x="50%" dy="-50">███████╗ ██████╗  ██████╗ ██╗  ██╗██████╗  ██████╗ ███████╗███████╗</tspan>
    <tspan x="50%" dy="20">██╔════╝██╔════╝ ██╔═══██╗██║ ██╔╝██╔══██╗██╔═══██╗██╔════╝██╔════╝</tspan>
    <tspan x="50%" dy="20">█████╗  ██║  ███╗██║   ██║█████╔╝ ██████╔╝██║   ██║███████╗███████╗</tspan>
    <tspan x="50%" dy="20">██╔══╝  ██║   ██║██║   ██║██╔═██╗ ██╔══██╗██║   ██║╚════██║╚════██║</tspan>
    <tspan x="50%" dy="20">███████╗╚██████╔╝╚██████╔╝██║  ██╗██║  ██║╚██████╔╝███████║███████║</tspan>
    <tspan x="50%" dy="20">╚══════╝ ╚═════╝  ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚══════╝</tspan>
  </text>
</svg>
